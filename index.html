<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi nhớ vị trí công tơ của khách hàng</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            color: #333;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 12px;
        }

        .fixed-header {
            flex-shrink: 0;
            background: #f4f4f9;
            padding-bottom: 8px;
        }

        .form-group { margin-bottom: 5px; }

        .header-logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .main-logo {
            width: 44px;
            height: 44px;
            object-fit: contain;
            flex-shrink: 0;
            mix-blend-mode: multiply;
        }

        .header-text-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .company-title {
            font-size: 16px;
            font-weight: bold;
            color: #1E90FF;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .customer-code-label {
            font-size: 14px;
            font-weight: bold;
            color: #444;
            line-height: 1.2;
        }

        label { display: block; font-weight: bold; margin-bottom: 4px; color: #444; font-size: 14px; }
        
        input[type="text"], input[type="password"], textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            background: #fff;
        }
        textarea { height: 50px; resize: none; }

        button { 
            width: 100%; 
            padding: 12px; 
            margin: 5px 0; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-get { background: #28a745; color: white; }
        
        .search-box { margin-top: 8px; }
        .search-input { border: 2px solid #007bff; background: #fff; font-size: 11px; font-style: italic;}

        .list-title {
            margin-top: 5px; 
            margin-bottom: 5px; 
            font-size: 16px;
            font-weight: bold;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
            position: relative;
        }

        ul { list-style-type: none; padding: 0; margin: 0; }
        li { 
            background: white; 
            margin-bottom: 10px; 
            padding: 12px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #eee;
        }
        li:hover { border-color: #007bff; }
        
        .loc-name { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 4px; }
        .loc-note { font-size: 13px; color: #555; margin-bottom: 6px; font-style: italic; }
        .time { font-size: 12px; color: #777; display: block; margin-bottom: 6px; }
        .coords { font-size: 14px; margin-bottom: 6px; color: #222; }
        .maps-link { display: inline-block; color: #0056b3; text-decoration: underline; font-weight: bold; font-size: 14px; }
        
        .action-bar { 
            display: none; 
            margin-top: 10px; 
            padding-top: 8px; 
            border-top: 1px dashed #ddd; 
            gap: 8px; 
        }
        .action-bar button { width: 50%; padding: 8px; font-size: 13px; margin: 0; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
        
        li.selected .action-bar { display: flex; }

        #toast-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
        }

        .toast {
            background-color: #28a745;
            color: #ffffff;
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.4s ease;
            word-wrap: break-word;
        }

        .toast.warning {
            background-color: #dc3545;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .loading-box {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 10px;
            color: #007bff;
            font-weight: bold;
            font-size: 15px;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #007bff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-box {
            background: #ffffff;
            width: 85%;
            max-width: 340px;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #28a745;
            margin-bottom: 12px;
        }

        .modal-message {
            font-size: 15px;
            color: #444;
            margin-bottom: 12px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 14px;
            border-radius: 6px;
            margin: 0;
        }

        .btn-modal-cancel { background: #e0e0e0; color: #333; }
        .btn-modal-confirm { background: #28a745; color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="fixed-header">
            <div class="form-group">
                <div class="header-logo-container">
                    <img src="LOGO.png" alt="CMIS Logo" class="main-logo">
                    <div class="header-text-group">
                        <div class="company-title">Điện lực Bến Lức - Định vị công tơ</div>
                        <label for="locName" class="customer-code-label">Mã khách hàng:</label>
                    </div>
                </div>
                <input type="text" id="locName" style="text-transform: uppercase;" value="PB060600">
            </div>

            <div class="form-group">
                <textarea id="locNote" placeholder="Nhập ghi chú thêm nếu có..."></textarea>
            </div>

            <button class="btn-get" onclick="getLocation()">Lấy tọa độ vị trí treo công tơ</button>

            <div class="list-title">Danh sách vị trí công tơ: <span id="locationCount" style="color: #007bff;">(0)</span></div>

            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Nhập gần đúng MKH, tên, ghi chú, tọa độ..." oninput="filterLocations()">
            </div>
        </div>

        <div class="scrollable-content">
            <div id="loadingBox" class="loading-box">
                <div class="spinner"></div>
                <span>Đang tải danh sách...</span>
            </div>

            <ul id="locationList"></ul>
        </div>
    </div>

    <!-- Hộp Toast -->
    <div id="toast-container"></div>

    <!-- Modal Xóa -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title" style="color: #dc3545;">Xác nhận xóa</div>
            <div class="modal-message">Bạn có chắc chắn muốn xóa khách hàng này?</div>
            
            <div class="form-group" style="text-align: left;">
                <label for="deletePasswordInput">Mật khẩu xác nhận:</label>
                <input type="password" id="deletePasswordInput" placeholder="Nhập mật khẩu...">
            </div>

            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closeConfirmModal()">Hủy</button>
                <button class="btn-modal-confirm" id="btnConfirmDelete" style="background: #dc3545;">Xóa</button>
            </div>
        </div>
    </div>

    <!-- Modal Sửa -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-box" style="text-align: left;">
            <div class="modal-title" style="text-align: center;">Chỉnh sửa thông tin</div>
            
            <div class="form-group">
                <label for="editNameInput">Mã khách hàng:</label>
                <input type="text" id="editNameInput" style="text-transform: uppercase;">
            </div>

            <div class="form-group">
                <label for="editNoteInput">Ghi chú:</label>
                <textarea id="editNoteInput"></textarea>
            </div>

            <div class="form-group">
                <label for="editPasswordInput">Mật khẩu xác nhận:</label>
                <input type="password" id="editPasswordInput" placeholder="Nhập mật khẩu...">
            </div>

            <div class="modal-buttons">
                <button class="btn-modal-cancel" onclick="closeEditModal()">Hủy</button>
                <button class="btn-modal-confirm" onclick="saveEditLocation()">Cập nhật</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
