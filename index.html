<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi nhớ vị trí công tơ của khách hàng</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f9;
            color: #333;
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            margin: 0 auto;
            box-sizing: border-box;
            padding: 12px;
        }

        .fixed-header {
            flex-shrink: 0;
            background: #f4f4f9;
            padding-bottom: 8px;
        }

        .form-group { margin-bottom: 10px; }
        label { display: block; font-weight: bold; margin-bottom: 4px; color: #444; font-size: 14px; }
        
        input[type="text"], textarea { 
            width: 100%; 
            padding: 10px 12px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px;
            background: #fff;
        }
        textarea { height: 60px; resize: none; }

        button { 
            width: 100%; 
            padding: 12px; 
            margin: 6px 0; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
        }
        .btn-get { background: #28a745; color: white; }
        
        .search-box { margin-top: 8px; }
        .search-input { border: 2px solid #007bff; background: #fff; }

        .list-title {
            margin-top: 10px; 
            margin-bottom: 6px; 
            font-size: 16px;
            font-weight: bold;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 2px;
        }

        ul { list-style-type: none; padding: 0; margin: 0; }
        li { 
            background: white; 
            margin-bottom: 10px; 
            padding: 12px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid #eee;
        }
        li:hover { border-color: #007bff; }
        
        .loc-name { font-size: 16px; font-weight: bold; color: #111; margin-bottom: 4px; }
        .loc-note { font-size: 13px; color: #555; margin-bottom: 6px; font-style: italic; }
        .time { font-size: 12px; color: #777; display: block; margin-bottom: 6px; }
        .coords { font-size: 14px; margin-bottom: 6px; color: #222; }
        .maps-link { display: inline-block; color: #0056b3; text-decoration: underline; font-weight: bold; font-size: 14px; }
        
        .action-bar { 
            display: none; 
            margin-top: 10px; 
            padding-top: 8px; 
            border-top: 1px dashed #ddd; 
            gap: 8px; 
        }
        .action-bar button { width: 50%; padding: 8px; font-size: 13px; margin: 0; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }
        
        li.selected .action-bar { display: flex; }

        /* --- CSS BẢNG THÔNG BÁO TOAST GÓC PHẢI MÀN HÌNH --- */
        #toast-container {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 320px;
        }

        .toast {
            background-color: #28a745; /* Nền xanh lá cây */
            color: #ffffff;            /* Chữ màu trắng */
            padding: 12px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.4s ease;
            word-wrap: break-word;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="fixed-header">
            <div class="form-group">
                <label for="locName">Mã khách hàng:</label>
                <input type="text" id="locName" style="text-transform: uppercase;" value="PB060600">
            </div>

            <div class="form-group">
                <label for="locNote">Ghi chú:</label>
                <textarea id="locNote" placeholder="Nhập ghi chú thêm nếu có..."></textarea>
            </div>

            <button class="btn-get" onclick="getLocation()">Lấy vị trí hiện tại</button>

            <div class="list-title">Danh sách vị trí đã lưu:</div>

            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" placeholder="🔍 Tìm kiếm tên, ghi chú, tọa độ..." oninput="filterLocations()">
            </div>
        </div>

        <div class="scrollable-content">
            <ul id="locationList"></ul>
        </div>
    </div>

    <!-- Khung chứa thông báo Toast -->
    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
